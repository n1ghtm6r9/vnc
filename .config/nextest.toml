[profile.default]
slow-timeout = { period = "5s", terminate-after = 4 }
leak-timeout = "1s"
fail-fast = false
failure-output = "immediate-final"
final-status-level = "flaky"

[profile.ci]
slow-timeout = { period = "10s", terminate-after = 3 }
leak-timeout = "1s"
fail-fast = false
failure-output = "immediate-final"
